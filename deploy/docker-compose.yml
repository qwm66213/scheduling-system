services:
  930-system:
    image: crpi-72tv8frgubni91pv.cn-shanghai.personal.cr.aliyuncs.com/930_system/930_system:latest
    container_name: 930-system
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - 930-data:/app/server/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=930-prod-jwt-secret-2024-secure
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/config/rules"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  930-data:
    driver: local
