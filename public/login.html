<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 930管理系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .login-box {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      width: 360px;
    }
    h2 { text-align: center; margin-bottom: 8px; color: #333; }
    .subtitle { text-align: center; margin-bottom: 24px; color: #999; font-size: 13px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; color: #666; font-size: 13px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: #667eea; }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { color: #ff4d4f; margin-top: 12px; text-align: center; font-size: 13px; }
    .tips { margin-top: 16px; padding: 12px; background: #f5f5f5; border-radius: 4px; font-size: 12px; color: #666; }
    .tips strong { color: #333; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>930管理系统</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
      </div>
      <button type="submit" id="submitBtn">登 录</button>
      <p id="error" class="error"></p>
    </form>
    <div class="tips">
      <strong>安全提示：</strong>密码长度至少8位，需包含大写字母、小写字母、数字、特殊符号中的至少三种
    </div>
  </div>
  <script>
    // 检查是否已登录（验证 Token 有效性）
    async function checkLogin() {
      const token = localStorage.getItem('token');
      if (!token) return;

      try {
        const res = await fetch('/api/auth/verify-token', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.status === 1) {
          window.location.href = '/';
        } else {
          // Token 无效，清除本地存储
          localStorage.removeItem('user');
          localStorage.removeItem('token');
          localStorage.removeItem('refreshToken');
        }
      } catch (err) {
        // 验证失败，清除本地存储
        localStorage.removeItem('user');
        localStorage.removeItem('token');
        localStorage.removeItem('refreshToken');
      }
    }
    checkLogin();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const error = document.getElementById('error');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      // 清除之前的错误提示
      error.textContent = '';

      // 参数校验
      if (!username) {
        error.textContent = '请输入用户名';
        return;
      }
      if (username.length < 2 || username.length > 20) {
        error.textContent = '用户名长度应为2-20个字符';
        return;
      }
      if (!password) {
        error.textContent = '请输入密码';
        return;
      }
      if (password.length < 8) {
        error.textContent = '密码长度不能少于8位';
        return;
      }

      btn.disabled = true;
      btn.textContent = '登录中...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.status === 1) {
          // 存储 Token 和用户信息
          localStorage.setItem('token', data.data.token);
          localStorage.setItem('refreshToken', data.data.refreshToken);
          localStorage.setItem('user', JSON.stringify(data.data.user));
          window.location.href = '/';
        } else {
          error.textContent = data.errmsg || '登录失败';
        }
      } catch (err) {
        error.textContent = '网络错误，请稍后重试';
      } finally {
        btn.disabled = false;
        btn.textContent = '登 录';
      }
    });
  </script>
</body>
</html>
